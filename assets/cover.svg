<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Pallet Sheet Generator</title>
  <desc id="desc">Banner for a Windows utility that creates pallet sheet DOCX files with barcodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#0b1928"/>
      <stop offset="1" stop-color="#071522"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.52" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#10b981" stop-opacity=".24"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#8bd7e8" stroke-opacity=".045"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="360" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <ellipse cx="130" cy="70" rx="320" ry="270" fill="url(#glow)"/>
    <ellipse cx="1090" cy="325" rx="310" ry="230" fill="#2563eb" fill-opacity=".08"/>
    <path d="M0 337C220 291 434 378 671 326S1035 286 1200 318V360H0Z" fill="#06101b" fill-opacity=".82"/>
    <rect x="1" y="1" width="1198" height="358" rx="25" fill="none" stroke="#5eead4" stroke-opacity=".2" stroke-width="2"/>

    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <g transform="translate(67 55)">
        <rect width="190" height="30" rx="15" fill="#0c2330" stroke="#34d399" stroke-opacity=".45"/>
        <circle cx="17" cy="15" r="4" fill="#5eead4" filter="url(#softGlow)"/>
        <text x="31" y="20" fill="#c4f8ed" font-size="11.5" font-weight="750" letter-spacing="1.8">DELWAVE · UTILITY</text>
      </g>

      <text x="67" y="144" fill="#f2fbff" font-size="46" font-weight="760" letter-spacing="1.3">PALLET SHEET</text>
      <text x="67" y="197" fill="#f2fbff" font-size="46" font-weight="760" letter-spacing="1.3">GENERATOR</text>
      <rect x="67" y="216" width="500" height="4" rx="2" fill="url(#accent)"/>
      <text x="67" y="254" fill="#9ee8e5" font-size="17" font-weight="650" letter-spacing="1.4">ГЕНЕРАТОР ПАЛЛЕТНОГО ЛИСТА</text>
      <text x="67" y="286" fill="#91a6b7" font-size="14.5">Данные паллеты  ·  Штрих-код  ·  Готовый DOCX</text>

      <g transform="translate(67 311)">
        <rect width="102" height="27" rx="13.5" fill="#0d2030" stroke="#60a5fa" stroke-opacity=".36"/>
        <text x="51" y="18" text-anchor="middle" fill="#b7d7ff" font-size="10" font-weight="750" letter-spacing="1">WINDOWS</text>
        <rect x="113" width="91" height="27" rx="13.5" fill="#0d2030" stroke="#22d3ee" stroke-opacity=".36"/>
        <text x="158.5" y="18" text-anchor="middle" fill="#b6f3fb" font-size="10" font-weight="750" letter-spacing="1">BARCODE</text>
        <rect x="215" width="93" height="27" rx="13.5" fill="#0d2030" stroke="#34d399" stroke-opacity=".36"/>
        <text x="261.5" y="18" text-anchor="middle" fill="#bdf5df" font-size="10" font-weight="750" letter-spacing="1">DOCX 1:1</text>
      </g>
    </g>

    <g transform="translate(760 38)" font-family="Inter,Segoe UI,Arial,sans-serif">
      <rect x="0" y="18" width="354" height="276" rx="22" fill="#0a1624" stroke="#70e2d4" stroke-opacity=".22"/>
      <rect x="18" y="0" width="238" height="300" rx="15" fill="#f3f7fa"/>
      <path d="M215 0h23a18 18 0 0 1 18 18v23Z" fill="#dce7ee"/>
      <path d="M215 0v41h41" fill="none" stroke="#b9ccd8" stroke-width="2"/>

      <rect x="40" y="31" width="86" height="9" rx="4.5" fill="#163046"/>
      <rect x="40" y="48" width="150" height="5" rx="2.5" fill="#a5b8c5"/>
      <rect x="40" y="59" width="126" height="5" rx="2.5" fill="#c3d0d9"/>

      <g transform="translate(41 87)" fill="#102436">
        <rect x="0" width="3" height="58"/>
        <rect x="7" width="2" height="58"/>
        <rect x="13" width="5" height="58"/>
        <rect x="22" width="2" height="58"/>
        <rect x="28" width="4" height="58"/>
        <rect x="37" width="2" height="58"/>
        <rect x="43" width="6" height="58"/>
        <rect x="54" width="3" height="58"/>
        <rect x="62" width="2" height="58"/>
        <rect x="68" width="5" height="58"/>
        <rect x="78" width="2" height="58"/>
        <rect x="84" width="4" height="58"/>
        <rect x="93" width="6" height="58"/>
        <rect x="104" width="2" height="58"/>
        <rect x="111" width="4" height="58"/>
        <rect x="120" width="2" height="58"/>
        <rect x="126" width="6" height="58"/>
        <rect x="137" width="3" height="58"/>
        <rect x="145" width="5" height="58"/>
        <rect x="155" width="2" height="58"/>
        <rect x="162" width="4" height="58"/>
      </g>
      <text x="123" y="157" text-anchor="middle" fill="#546b7b" font-size="8" letter-spacing="3">4600123456789</text>

      <g fill="#d7e2e9">
        <rect x="40" y="181" width="194" height="1.5"/>
        <rect x="40" y="211" width="194" height="1.5"/>
        <rect x="40" y="241" width="194" height="1.5"/>
      </g>
      <g fill="#718897" font-size="8.5" font-weight="650">
        <text x="40" y="176">PRODUCT</text>
        <text x="40" y="206">PALLET / BOXES</text>
        <text x="40" y="236">DATE / EXPIRY</text>
      </g>
      <circle cx="217" cy="270" r="12" fill="#10b981" fill-opacity=".13" stroke="#10b981"/>
      <path d="m211 270 4 4 8-9" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

      <g transform="translate(272 74)">
        <rect width="64" height="64" rx="15" fill="#11263a" stroke="#60a5fa" stroke-opacity=".45"/>
        <path d="M19 14h19l9 9v27H19Z" fill="#60a5fa" fill-opacity=".15" stroke="#7db7ff"/>
        <path d="M38 14v10h9" fill="none" stroke="#7db7ff"/>
        <text x="33" y="42" text-anchor="middle" fill="#b8d8ff" font-size="10" font-weight="800">DOCX</text>
      </g>
      <path d="M272 154c-31 0-34 32-57 32" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
      <path d="m220 180-7 6 8 4" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(272 219)">
        <rect width="64" height="30" rx="15" fill="#0f2b31" stroke="#34d399" stroke-opacity=".5"/>
        <circle cx="16" cy="15" r="4" fill="#5eead4"/>
        <text x="40" y="19" text-anchor="middle" fill="#bdf6e3" font-size="9" font-weight="750">READY</text>
      </g>
    </g>
  </g>
</svg>
